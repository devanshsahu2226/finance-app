<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<link rel="stylesheet" href="style.v3.css">

<!-- Script section mein ye update karein -->
<script>
    // COMPLETELY REMOVE OLD SERVICE WORKER & REGISTER NEW
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.getRegistrations().then(registrations => {
                for(let registration of registrations) {
                    registration.unregister();
                }
            }).then(() => {
                caches.keys().then(cacheNames => {
                    return Promise.all(
                        cacheNames.map(cacheName => caches.delete(cacheName))
                    );
                });
            }).then(() => {
                return navigator.serviceWorker.register('./sw.v3.js');
            }).then(reg => {
                console.log('New Service Worker Registered v3');
            }).catch(err => {
                console.log('Service Worker Error:', err);
            });
        });
    }
    // ... baaki existing code ...
</script>
