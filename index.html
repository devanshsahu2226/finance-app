<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0a0e17">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Finance Dashboard</title>
    
    <!-- CSS LINKS -->
    <link rel="stylesheet" href="style.css">      <!-- ✅ Common Styles -->
    <link rel="stylesheet" href="home.css">       <!-- ✅ Home Page Specific -->
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="mobile-frame">
        
        <!-- HEADER -->
        <header class="top-header">
            <div class="header-content">
                <div class="profile">
                    <div class="avatar"><i class="fa-solid fa-user"></i></div>
                    <div class="name">
                        <h1>Sureshkumar</h1>
                        <p>sureshkumar</p>
                    </div>
                </div>
                <button class="logout-btn" onclick="handleLogout()">
                    <i class="fa-solid fa-arrow-right-from-bracket"></i>
                    <span>Logout</span>
                </button>
            </div>
        </header>

        <!-- SINGLE NIFTY CARD -->
        <div class="market-indices-fixed">
            <div class="card nifty-single">
                <div class="nifty-header">
                    <div class="nifty-left">
                        <div class="card-header"><i class="fa-solid fa-chart-line"></i> Nifty 50</div>
                        <div class="value">24,005.80</div>
                        <div class="change up"><i class="fa-solid fa-arrow-trend-up"></i> +882.15 (+3.81%)</div>
                    </div>
                    <button class="refresh-btn" onclick="refreshNifty()">
                        <i class="fa-solid fa-rotate"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- SCROLLABLE CONTENT -->
        <div class="content-wrapper">
            <div class="content-spacer"></div>
            
            <!-- Total Value Section -->
            <section class="total-value-section">
                <h2 class="section-title">Total Value</h2>
                <div class="donut-container">
                    <div class="donut-chart" id="donutChart">
                        <div class="donut-inner">
                            <p>Total Value</p>
                            <h2>₹1.42L</h2>
                            <p class="change">↗ +4.55%</p>
                        </div>
                    </div>
                </div>
                <div class="legend" id="chartLegend"></div>
            </section>

            <!-- Stats Grid -->
            <section class="stats-grid">
                <div class="card stat-card invested">
                    <p class="label">Invested</p>
                    <p class="amount">₹1,35,932.03</p>
                </div>
                <div class="card stat-card current">
                    <p class="label">Current</p>
                    <p class="amount">₹1,42,111.51</p>
                </div>
                <div class="card stat-card pnl">
                    <p class="label">P&L</p>
                    <p class="amount">+₹6,179.48</p>
                    <p class="sub">+4.55%</p>
                </div>
            </section>

            <!-- Quick Access Cards -->
            <section class="quick-access-section">
                <div class="card quick-access-card" onclick="window.location.href='mutual-funds.html'">
                    <div class="quick-icon mutual-funds-icon">
                        <i class="fa-solid fa-chart-pie"></i>
                    </div>
                    <div class="quick-info">
                        <h3>Mutual Funds</h3>
                        <p>2 funds</p>
                    </div>
                    <div class="quick-arrow">
                        <i class="fa-solid fa-chevron-right"></i>
                    </div>
                </div>
                <div class="card quick-access-card" onclick="window.location.href='nps.html'">
                    <div class="quick-icon nps-icon">
                        <i class="fa-solid fa-shield-halved"></i>
                    </div>
                    <div class="quick-info">
                        <h3>NPS</h3>
                        <p>1 account</p>
                    </div>
                    <div class="quick-arrow">
                        <i class="fa-solid fa-chevron-right"></i>
                    </div>
                </div>
                <div class="card quick-access-card">
                    <div class="quick-icon fd-icon">
                        <i class="fa-solid fa-d"></i>
                    </div>
                    <div class="quick-info">
                        <h3>FD</h3>
                        <p>0 accounts</p>
                    </div>
                    <div class="quick-arrow">
                        <i class="fa-solid fa-chevron-right"></i>
                    </div>
                </div>
            </section>
        </div>

        <!-- BOTTOM NAVIGATION -->
        <nav class="bottom-nav">
            <div class="nav-item active">
                <i class="fa-solid fa-house"></i>
                <span>Home</span>
            </div>
            <div class="nav-item" onclick="window.location.href='mutual-funds.html'">
                <i class="fa-solid fa-chart-pie"></i>
                <span>Mutual Funds</span>
            </div>
            <div class="nav-item" onclick="window.location.href='nps.html'">
                <i class="fa-solid fa-shield-halved"></i>
                <span>NPS</span>
            </div>
            <div class="nav-item">
                <i class="fa-solid fa-d"></i>
                <span>FD</span>
            </div>
            <div class="nav-item">
                <i class="fa-solid fa-star"></i>
                <span>Watchlist</span>
            </div>
        </nav>
    </div>

    <script>
        const fundData = [
            { name: 'Parag Parikh Flexi Cap', value: 52000, color: '#38ef7d' },
            { name: 'UTI Nifty 50 Index Fund', value: 53200, color: '#0072ff' },
            { name: 'NPS', value: 36900, color: '#f7971e' }
        ];
        const totalValue = fundData.reduce((sum, fund) => sum + fund.value, 0);
        
        function generateDonutGradient() {
            let gradient = 'conic-gradient(';
            let currentPercent = 0;
            fundData.forEach((fund, index) => {
                const percentage = (fund.value / totalValue) * 100;
                gradient += `${fund.color} ${currentPercent}% ${currentPercent + percentage}%`;
                if (index < fundData.length - 1) gradient += ', ';
                currentPercent += percentage;
            });
            gradient += ')';
            return gradient;
        }

        function generateLegend() {
            const legendContainer = document.getElementById('chartLegend');
            let legendHTML = '';
            fundData.forEach(fund => {
                const percentage = ((fund.value / totalValue) * 100).toFixed(1);
                legendHTML += `<div class="legend-item"><span class="dot" style="background: ${fund.color}"></span><span>${fund.name} (${percentage}%)</span></div>`;
            });
            legendContainer.innerHTML = legendHTML;
        }

        document.getElementById('donutChart').style.background = generateDonutGradient();
        generateLegend();

        function handleLogout() {
            if(confirm("Are you sure you want to logout?")) {
                alert("Logged out successfully!");
            }
        }

        function refreshNifty() {
            const refreshBtn = document.querySelector('.refresh-btn i');
            refreshBtn.classList.add('fa-spin');
            setTimeout(() => {
                refreshBtn.classList.remove('fa-spin');
            }, 1000);
        }
    </script>
</body>
</html>
