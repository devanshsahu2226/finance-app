<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0a0e17">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Finance Dashboard</title>
    
    <!-- CSS LINKS -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="home.css">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="mobile-frame">
        
        <!-- HEADER -->
        <header class="top-header">
            <div class="header-content">
                <div class="profile">
                    <div class="avatar"><i class="fa-solid fa-user"></i></div>
                    <div class="name">
                        <h1>Sureshkumar</h1>
                        <p>sureshkumar</p>
                    </div>
                </div>
                <button class="logout-btn" onclick="handleLogout()">
                    <i class="fa-solid fa-arrow-right-from-bracket"></i>
                    <span>Logout</span>
                </button>
            </div>
        </header>

        <!-- SINGLE NIFTY CARD -->
        <div class="market-indices-fixed">
            <div class="card nifty-single">
                <div class="nifty-header">
                    <div class="nifty-left">
                        <div class="card-header"><i class="fa-solid fa-chart-line"></i> Nifty 50</div>
                        <div class="value">24,005.80</div>
                        <div class="change up"><i class="fa-solid fa-arrow-trend-up"></i> +882.15 (+3.81%)</div>
                    </div>
                    <button class="refresh-btn" onclick="refreshNifty()">
                        <i class="fa-solid fa-rotate"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- SCROLLABLE CONTENT -->
        <div class="content-wrapper">
            <div class="content-spacer"></div>
            
            <!-- Total Value Section -->
            <section class="total-value-section">
                <h2 class="section-title">Total Value</h2>
                <div class="donut-container">
                    <div class="donut-chart" id="donutChart">
                        <div class="donut-inner">
                            <p>Total Value</p>
                            <h2 id="totalValueDisplay">₹0.00</h2>
                            <p class="change" id="totalValuePercent">↗ 0.00%</p>
                        </div>
                    </div>
                </div>
                <div class="legend" id="chartLegend"></div>
            </section>

            <!-- Stats Grid -->
            <section class="stats-grid">
                <div class="card stat-card invested">
                    <p class="label">Invested</p>
                    <p class="amount" id="homeTotalInvested">₹0.00</p>
                </div>
                <div class="card stat-card current">
                    <p class="label">Current</p>
                    <p class="amount" id="homeTotalCurrent">₹0.00</p>
                </div>
                <div class="card stat-card pnl">
                    <p class="label">P&L</p>
                    <p class="amount" id="homeTotalPnL">₹0.00</p>
                    <p class="sub" id="homeTotalPnLPercent">0.00%</p>
                </div>
            </section>

            <!-- Quick Access Cards -->
            <section class="quick-access-section">
                <div class="card quick-access-card" onclick="window.location.href='mutual-funds.html'">
                    <div class="quick-icon mutual-funds-icon">
                        <i class="fa-solid fa-chart-pie"></i>
                    </div>
                    <div class="quick-info">
                        <h3>Mutual Funds</h3>
                        <p id="homeFundCount">0 funds</p>
                    </div>
                    <div class="quick-arrow">
                        <i class="fa-solid fa-chevron-right"></i>
                    </div>
                </div>
                <div class="card quick-access-card" onclick="window.location.href='nps.html'">
                    <div class="quick-icon nps-icon">
                        <i class="fa-solid fa-shield-halved"></i>
                    </div>
                    <div class="quick-info">
                        <h3>NPS</h3>
                        <p>1 account</p>
                    </div>
                    <div class="quick-arrow">
                        <i class="fa-solid fa-chevron-right"></i>
                    </div>
                </div>
                <div class="card quick-access-card">
                    <div class="quick-icon fd-icon">
                        <i class="fa-solid fa-d"></i>
                    </div>
                    <div class="quick-info">
                        <h3>FD</h3>
                        <p>0 accounts</p>
                    </div>
                    <div class="quick-arrow">
                        <i class="fa-solid fa-chevron-right"></i>
                    </div>
                </div>
            </section>
        </div>

        <!-- BOTTOM NAVIGATION -->
        <nav class="bottom-nav">
            <div class="nav-item active">
                <i class="fa-solid fa-house"></i>
                <span>Home</span>
            </div>
            <div class="nav-item" onclick="window.location.href='mutual-funds.html'">
                <i class="fa-solid fa-chart-pie"></i>
                <span>Mutual Funds</span>
            </div>
            <div class="nav-item" onclick="window.location.href='nps.html'">
                <i class="fa-solid fa-shield-halved"></i>
                <span>NPS</span>
            </div>
            <div class="nav-item">
                <i class="fa-solid fa-d"></i>
                <span>FD</span>
            </div>
            <div class="nav-item">
                <i class="fa-solid fa-star"></i>
                <span>Watchlist</span>
            </div>
        </nav>
    </div>

    <script>
        // Load data from localStorage on page load
        window.onload = function() {
            loadHomeData();
        };

        // Listen for storage changes (when MF page updates)
        window.addEventListener('storage', function() {
            loadHomeData();
        });

        // Load and display home data from localStorage
        function loadHomeData() {
            const storedFunds = localStorage.getItem('mutualFunds');
            
            if (storedFunds) {
                const fundsList = JSON.parse(storedFunds);
                updateHomeDisplay(fundsList);
            } else {
                // No funds yet
                updateHomeDisplay([]);
            }
        }

        // Update home page display
        function updateHomeDisplay(fundsList) {
            let totalInvested = 0;
            let totalCurrentValue = 0;

            fundsList.forEach(fund => {
                totalInvested += fund.invested;
                totalCurrentValue += fund.currentValue;
            });

            const totalPnL = totalCurrentValue - totalInvested;
            const totalPnLPercent = totalInvested > 0 ? ((totalPnL / totalInvested) * 100).toFixed(2) : 0;
            const totalValue = totalCurrentValue;

            // Update Stats Cards
            document.getElementById('homeTotalInvested').textContent = '₹' + totalInvested.toLocaleString('en-IN', {minimumFractionDigits: 2});
            document.getElementById('homeTotalCurrent').textContent = '₹' + totalCurrentValue.toLocaleString('en-IN', {minimumFractionDigits: 2});
            
            const pnlEl = document.getElementById('homeTotalPnL');
            const pnlPercentEl = document.getElementById('homeTotalPnLPercent');
            
            pnlEl.textContent = (totalPnL >= 0 ? '+' : '') + '₹' + Math.abs(totalPnL).toLocaleString('en-IN', {minimumFractionDigits: 2});
            pnlPercentEl.textContent = (parseFloat(totalPnLPercent) >= 0 ? '+' : '') + totalPnLPercent + '%';
            
            // Update Total Value Display
            document.getElementById('totalValueDisplay').textContent = '₹' + totalValue.toLocaleString('en-IN', {maximumFractionDigits: 0});
            document.getElementById('totalValuePercent').textContent = (parseFloat(totalPnLPercent) >= 0 ? '↗ ' : '↘ ') + Math.abs(totalPnLPercent) + '%';

            // Update Fund Count
            document.getElementById('homeFundCount').textContent = fundsList.length + ' fund' + (fundsList.length !== 1 ? 's' : '');

            // Update Donut Chart
            updateDonutChart(fundsList);
        }

        // Update Donut Chart
        function updateDonutChart(fundsList) {
            const chartElement = document.getElementById('donutChart');
            const legendElement = document.getElementById('chartLegend');
            
            if (fundsList.length === 0) {
                chartElement.style.background = 'conic-gradient(#38ef7d 0% 100%)';
                legendElement.innerHTML = '<p style="color: #a0a5b1; font-size: 13px;">No funds added yet</p>';
                return;
            }

            const totalValue = fundsList.reduce((sum, fund) => sum + fund.currentValue, 0);
            
            // Generate colors for each fund
            const colors = ['#38ef7d', '#0072ff', '#f7971e', '#6366f1', '#ec4899', '#8b5cf6'];
            
            let gradient = 'conic-gradient(';
            let legendHTML = '';
            let currentPercent = 0;

            fundsList.forEach((fund, index) => {
                const percentage = (fund.currentValue / totalValue) * 100;
                const color = colors[index % colors.length];
                
                gradient += `${color} ${currentPercent}% ${currentPercent + percentage}%`;
                
                legendHTML += `
                    <div class="legend-item">
                        <span class="dot" style="background: ${color}"></span>
                        <span>${fund.name.substring(0, 30)}${fund.name.length > 30 ? '...' : ''} (${percentage.toFixed(1)}%)</span>
                    </div>
                `;
                
                if (index < fundsList.length - 1) {
                    gradient += ', ';
                }
                
                currentPercent += percentage;
            });

            gradient += ')';
            
            chartElement.style.background = gradient;
            legendElement.innerHTML = legendHTML;
        }

        function handleLogout() {
            if(confirm("Are you sure you want to logout?")) {
                alert("Logged out successfully!");
            }
        }

        function refreshNifty() {
            const refreshBtn = document.querySelector('.refresh-btn i');
            refreshBtn.classList.add('fa-spin');
            setTimeout(() => {
                refreshBtn.classList.remove('fa-spin');
            }, 1000);
        }

        // Auto-refresh home data every 30 seconds
        setInterval(loadHomeData, 30000);
    </script>
</body>
</html>
